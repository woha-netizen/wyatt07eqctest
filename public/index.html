<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | IAM Demo Application</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="home">
  <nav>
    <a class="logo" href="/">IAM Demo</a>
    <a href="/">Home</a>
    <a href="/dashboard" data-auth="in" class="hidden">Dashboard</a>
    <a href="/profile" data-auth="in" class="hidden">Profile</a>
    <a href="/admin" data-auth="admin" class="hidden">Admin</a>
    <a href="/login" data-auth="out">Log in</a>
    <a href="/register" data-auth="out">Register</a>
    <button id="logout" class="linkbtn hidden" data-auth="in" type="button">Log out</button>
    <span class="user-chip" id="user-chip"></span>
  </nav>
  <main>
    <h1>IAM Demo Application</h1>
    <p>Welcome to the Cloudflare IAM demonstration website.</p>
    <p>This page represents a protected web application.</p>
    <p class="status">Application is running</p>
    <p>Access should only be granted to authorised users.</p>
    <div class="cta">
      <a class="btn" href="/login" data-auth="out">Log in</a>
      <a class="btn secondary" href="/register" data-auth="out">Create account</a>
      <a class="btn hidden" href="/dashboard" data-auth="in">Open dashboard</a>
    </div>
  </main>
</body>
</html>
