<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | IAM Demo Application</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="profile">
  <nav>
    <a class="logo" href="/">IAM Demo</a>
    <a href="/">Home</a>
    <a href="/dashboard" data-auth="in" class="hidden">Dashboard</a>
    <a href="/profile" data-auth="in" class="hidden">Profile</a>
    <a href="/admin" data-auth="admin" class="hidden">Admin</a>
    <a href="/login" data-auth="out">Log in</a>
    <a href="/register" data-auth="out">Register</a>
    <button id="logout" class="linkbtn hidden" data-auth="in" type="button">Log out</button>
    <span class="user-chip" id="user-chip"></span>
  </nav>
  <main class="wide">
    <h1>Your profile</h1>
    <dl>
      <dt>Username</dt><dd id="p-username">—</dd>
      <dt>Email</dt><dd id="p-email">—</dd>
      <dt>Role</dt><dd id="p-role">—</dd>
      <dt>Status</dt><dd id="p-status">—</dd>
      <dt>Member since</dt><dd id="p-since">—</dd>
      <dt>Last login</dt><dd id="p-last">—</dd>
    </dl>
    <h2>Change password</h2>
    <form id="pw-form">
      <label for="current">Current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
      <label for="next">New password</label>
      <input id="next" name="next" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <button class="btn" type="submit">Change password</button>
      <div id="msg" class="msg hidden" role="alert"></div>
    </form>
  </main>
</body>
</html>
