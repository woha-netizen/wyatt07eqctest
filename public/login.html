<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | IAM Demo Application</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="login">
  <nav>
    <a class="logo" href="/">IAM Demo</a>
    <a href="/">Home</a>
    <a href="/dashboard" data-auth="in" class="hidden">Dashboard</a>
    <a href="/profile" data-auth="in" class="hidden">Profile</a>
    <a href="/admin" data-auth="admin" class="hidden">Admin</a>
    <a href="/login" data-auth="out">Log in</a>
    <a href="/register" data-auth="out">Register</a>
    <button id="logout" class="linkbtn hidden" data-auth="in" type="button">Log out</button>
    <span class="user-chip" id="user-chip"></span>
  </nav>
  <main class="form">
    <h1>Log in</h1>
    <form id="auth-form">
      <label for="identifier">Email or username</label>
      <input id="identifier" name="identifier" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn block" type="submit">Log in</button>
      <div id="msg" class="msg hidden" role="alert"></div>
    </form>
    <p class="note">No account yet? <a href="/register">Create one</a>.</p>
  </main>
</body>
</html>
