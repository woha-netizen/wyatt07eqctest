<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | IAM Demo Application</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="register">
  <nav>
    <a class="logo" href="/">IAM Demo</a>
    <a href="/">Home</a>
    <a href="/dashboard" data-auth="in" class="hidden">Dashboard</a>
    <a href="/profile" data-auth="in" class="hidden">Profile</a>
    <a href="/admin" data-auth="admin" class="hidden">Admin</a>
    <a href="/login" data-auth="out">Log in</a>
    <a href="/register" data-auth="out">Register</a>
    <button id="logout" class="linkbtn hidden" data-auth="in" type="button">Log out</button>
    <span class="user-chip" id="user-chip"></span>
  </nav>
  <main class="form">
    <h1>Create account</h1>
    <form id="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required>
      <div class="hint">3 to 24 letters, numbers or underscores.</div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      <div class="hint">At least 10 characters.</div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      <button class="btn block" type="submit">Create account</button>
      <div id="msg" class="msg hidden" role="alert"></div>
    </form>
    <p class="note">Already registered? <a href="/login">Log in</a>. The first account created becomes the administrator.</p>
  </main>
</body>
</html>
