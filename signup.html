<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up</title><link rel="stylesheet" href="style.css"></head><body><nav><a class="logo" href="index.html">MySite</a><div id="links"></div></nav>
<form class="card" id="f"><h2>Create account</h2><label>Name</label><input id="name" required autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label>Confirm password</label><input id="confirm" type="password" required autocomplete="new-password"><div class="cf-turnstile"></div><button class="btn">Sign up</button><div id="msg" class="msg"></div><p class="muted">Already have an account? <a href="login.html">Log in</a></p></form>

<script src="app.js"></script><script src="data.js"></script><script>renderNav();$('#f').onsubmit=handleSignup;</script></body></html>
